<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0E1116">
  <meta
    name="description"
    content="AETHER OS — a macOS-grade, security-hardened Linux desktop for the Raspberry Pi 4. One switch arms the box: Tor + a VPN kill-switch. Learn the tools, stay in scope, ship a report."
  >
  <title>AETHER OS — Field Manuals for the hardened desktop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #0E1116;
      --ink-deep: #080A0E;
      --ink-soft: #171B22;
      --pink: #35D0BA;
      --pink-bright: #6FF0DC;
      --text: #E6EAF0;
      --muted: #9AA4B2;
      --periwinkle: #35D0BA;
      --sage: #89946f;
      --clay: #D29922;
      --moss: #5f684f;
      --paper: #E6EAF0;
      --serif: "Instrument Serif", "Iowan Old Style", "Palatino Linotype", Palatino,
        Baskerville, Georgia, serif;
      --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --ease: cubic-bezier(.2, .78, .2, 1);
      --mx: 0px;
      --my: 0px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: var(--ink);
    }

    body {
      min-height: 100svh;
      overflow: hidden;
      color: var(--text);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      cursor: default;
    }

    /* Display voice: the editorial serif. Body and UI stay in the sans. */
    .hero-word, .cover-title, .detail-title, .menu-link { font-family: var(--serif); }
    ::selection { background: rgba(53, 208, 186, .3); color: #fff; }
    :root { accent-color: var(--pink); }

    button,
    a {
      font: inherit;
    }

    button {
      color: inherit;
    }

    .stage {
      position: relative;
      isolation: isolate;
      width: 100%;
      min-height: 100svh;
      overflow: hidden;
      background:
        radial-gradient(circle at 49% 84%, rgba(53, 208, 186, .14), transparent 36%),
        radial-gradient(circle at 14% 4%, rgba(90, 120, 255, .10), transparent 30%),
        linear-gradient(180deg, #12202a 0%, var(--ink) 50%, #05070a 100%);
    }

    .stage::after {
      content: "";
      position: absolute;
      z-index: 30;
      inset: 0;
      pointer-events: none;
      opacity: .12;
      background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.86' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.22'/%3E%3C/svg%3E");
      mix-blend-mode: soft-light;
    }

    .topbar {
      position: fixed;
      z-index: 50;
      top: 0;
      left: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 26px 3.2vw;
      pointer-events: none;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      color: var(--text);
      font-size: clamp(20px, 1.9vw, 27px);
      font-weight: 700;
      letter-spacing: -.02em;
      line-height: 1;
      text-decoration: none;
      pointer-events: auto;
    }

    .brand .mark {
      display: inline-grid;
      place-items: center;
      width: 30px;
      height: 30px;
      color: var(--ink);
      background: var(--pink);
      border-radius: 9px;
      font-size: 17px;
      font-weight: 800;
      font-family: var(--mono);
      box-shadow: 0 6px 16px rgba(2, 6, 10, .55), 0 0 14px rgba(53, 208, 186, .4);
    }

    .brand .brand-os { color: var(--pink); }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      pointer-events: auto;
    }

    .icon-button,
    .ticket-button,
    .close-button,
    .pill,
    .book-card {
      border: 0;
      outline: 0;
      -webkit-tap-highlight-color: transparent;
    }

    .icon-button,
    .ticket-button {
      height: 50px;
      border: 1px solid rgba(53, 208, 186, .22);
      background: rgba(23, 27, 34, .82);
      color: var(--text);
      box-shadow: 0 8px 26px rgba(5, 8, 12, .4);
      transition: transform 240ms var(--ease), background-color 240ms ease, border-color 240ms ease;
    }

    .icon-button {
      display: grid;
      width: 50px;
      place-items: center;
      border-radius: 50%;
      cursor: pointer;
    }

    .menu-glyph {
      position: relative;
      width: 14px;
      height: 10px;
    }

    .menu-glyph::before,
    .menu-glyph::after {
      content: "";
      position: absolute;
      left: 1px;
      width: 12px;
      height: 2px;
      border-radius: 2px;
      background: currentColor;
      transition: transform 300ms var(--ease), top 300ms var(--ease);
    }

    .menu-glyph::before {
      top: 2px;
    }

    .menu-glyph::after {
      top: 7px;
    }

    [data-menu="open"] .menu-glyph::before {
      top: 5px;
      transform: rotate(45deg);
    }

    [data-menu="open"] .menu-glyph::after {
      top: 5px;
      transform: rotate(-45deg);
    }

    .ticket-button {
      display: inline-grid;
      min-width: 138px;
      padding: 0 25px;
      place-items: center;
      border-radius: 999px;
      cursor: pointer;
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      text-decoration: none;
    }

    .icon-button:hover,
    .ticket-button:hover {
      transform: translateY(-3px);
      background: rgba(53, 208, 186, .16);
      border-color: rgba(53, 208, 186, .5);
    }

    .icon-button:focus-visible,
    .ticket-button:focus-visible,
    .close-button:focus-visible,
    .pill:focus-visible,
    .menu-link:focus-visible {
      outline: 2px solid var(--pink-bright);
      outline-offset: 4px;
    }

    .hero-word {
      position: absolute;
      z-index: 1;
      top: 11.5vh;
      left: 50%;
      margin: 0;
      color: var(--pink);
      font-size: clamp(184px, 22vw, 325px);
      font-style: italic;
      font-weight: 500;
      letter-spacing: -.085em;
      line-height: .84;
      white-space: nowrap;
      text-shadow: 0 0 42px rgba(53, 208, 186, .26);
      transform: translate3d(calc(-50% + var(--mx) * -.12), calc(var(--my) * -.12), 0);
      transition: opacity 700ms ease, filter 700ms ease, transform 900ms var(--ease);
      user-select: none;
    }

    .gallery {
      position: absolute;
      z-index: 5;
      inset: 0;
      perspective: 1400px;
      transform-style: flat;
    }

    .book-card {
      --hover-y: 0px;
      --local-x: 0px;
      --local-y: 0px;
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: var(--w);
      aspect-ratio: .672 / 1;
      padding: 0;
      background: transparent;
      cursor: pointer;
      transform:
        translate3d(
          calc(-50% + var(--local-x)),
          calc(var(--hover-y) + var(--local-y)),
          0
        )
        rotate(var(--r))
        rotateY(var(--yaw));
      transform-style: preserve-3d;
      transition:
        left 1100ms var(--ease),
        top 1100ms var(--ease),
        width 1100ms var(--ease),
        opacity 500ms ease,
        filter 500ms ease,
        transform 520ms var(--ease);
      will-change: transform, left, top, width;
    }

    .book-card[data-book="labmode"] {
      --x: 23.2%;
      --y: 40.5%;
      --w: min(30.5vw, 435px);
      --r: -8deg;
      --yaw: -7deg;
      z-index: 1;
    }

    .book-card[data-book="labs"] {
      --x: 50%;
      --y: 32.2%;
      --w: min(33vw, 470px);
      --r: .8deg;
      --yaw: -3deg;
      z-index: 3;
    }

    .book-card[data-book="hardened"] {
      --x: 77%;
      --y: 42%;
      --w: min(30.5vw, 435px);
      --r: 8deg;
      --yaw: 7deg;
      z-index: 2;
    }

    .book-card:hover,
    .book-card[data-hovered="true"] {
      --hover-y: -28px;
      z-index: 8;
    }

    .book {
      position: relative;
      display: block;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 800ms var(--ease);
    }

    .book-card:hover .book {
      transform: scale(1.035) rotateX(-1.5deg);
    }

    .book-back,
    .page-block,
    .page-fan,
    .front-cover,
    .book-shadow {
      position: absolute;
      inset: 0;
      border-radius: 3px 7px 7px 3px;
    }

    .book-shadow {
      z-index: -2;
      inset: 5% -4% -2% 4%;
      border-radius: 12px;
      background: rgba(2, 5, 8, .8);
      filter: blur(22px);
      opacity: .72;
      transform: translate3d(18px, 28px, -60px);
    }

    .book-back {
      z-index: 0;
      background: var(--cover-color);
      box-shadow: 0 18px 30px rgba(2, 5, 8, .5);
      transform: translate3d(7px, 1px, -26px);
    }

    .page-block {
      z-index: 1;
      inset: 1.7% 1.4% 1.7% 3.8%;
      overflow: visible;
      border: 1px solid rgba(53, 208, 186, .18);
      border-radius: 2px 5px 5px 2px;
      background:
        repeating-linear-gradient(
          0deg,
          rgba(53, 208, 186, .10) 0,
          rgba(53, 208, 186, .10) 1px,
          transparent 1px,
          transparent 2.8px
        ),
        linear-gradient(90deg, #1b222b 0%, #232c38 14%, #1e2630 87%, #161c24 100%);
      box-shadow: 7px 5px 16px rgba(2, 6, 10, .4);
      transform: translate3d(7px, 1px, -12px);
      transition: transform 1100ms var(--ease), inset 1100ms var(--ease);
    }

    .page-block::before {
      content: "";
      position: absolute;
      top: -7px;
      right: 1px;
      left: 1px;
      height: 8px;
      border-radius: 2px 4px 0 0;
      background:
        repeating-linear-gradient(
          90deg,
          #1d2630 0,
          #1d2630 2px,
          #2a3542 2px,
          #2a3542 5px
        );
      transform: skewX(-8deg);
      transform-origin: bottom left;
    }

    .page-block::after {
      content: "";
      position: absolute;
      top: 0;
      right: -7px;
      width: 8px;
      height: 100%;
      border-radius: 0 4px 4px 0;
      background:
        repeating-linear-gradient(
          0deg,
          #161c24 0,
          #161c24 1px,
          #232c38 1px,
          #232c38 3px
        );
      box-shadow: 3px 2px 7px rgba(2, 6, 10, .3);
      transform: skewY(-2deg);
      transform-origin: left center;
    }

    .page-fan {
      z-index: 2;
      inset: 2.4% 2% 2.4% 4.3%;
      pointer-events: none;
      transform-style: preserve-3d;
    }

    .page-fan i {
      position: absolute;
      inset: 0;
      display: block;
      border: 1px solid rgba(53, 208, 186, .18);
      border-radius: 2px 5px 5px 2px;
      background:
        linear-gradient(90deg, rgba(53, 208, 186, .18), transparent 9%),
        repeating-linear-gradient(
          0deg,
          #1f2832 0,
          #1f2832 2px,
          #18202a 2px,
          #18202a 3px
        );
      box-shadow: 3px 5px 10px rgba(2, 6, 10, .2);
      opacity: 0;
      transform: translate3d(0, 0, 0) rotateY(0);
      transform-origin: 1.5% center;
      transition: opacity 500ms ease, transform 1200ms var(--ease);
    }

    .front-cover {
      z-index: 3;
      overflow: hidden;
      border: 1px solid rgba(230, 234, 240, .14);
      background-color: var(--cover-color);
      background-image:
        radial-gradient(130% 80% at 50% -10%, rgba(53, 208, 186, .18), transparent 60%),
        linear-gradient(180deg, rgba(255, 255, 255, .05), transparent 30%);
      background-position: center;
      background-size: cover;
      box-shadow:
        0 25px 38px rgba(2, 5, 8, .5),
        inset -12px 0 18px rgba(0, 0, 0, .3),
        inset 4px 0 9px rgba(255, 255, 255, .06);
      transform: translate3d(0, 0, 12px);
      transform-origin: 1.5% center;
      transform-style: preserve-3d;
      transition: transform 1200ms var(--ease), box-shadow 600ms ease;
    }

    .front-cover::before {
      content: "";
      position: absolute;
      z-index: 3;
      top: 0;
      bottom: 0;
      left: 0;
      width: 5.5%;
      background:
        linear-gradient(
          90deg,
          rgba(0, 0, 0, .4),
          rgba(255, 255, 255, .06) 35%,
          rgba(0, 0, 0, .18) 75%,
          transparent
        );
      mix-blend-mode: multiply;
      opacity: .85;
    }

    .front-cover::after {
      content: "";
      position: absolute;
      z-index: 4;
      inset: 0;
      border: 3px solid rgba(53, 208, 186, .06);
      border-radius: inherit;
      pointer-events: none;
    }

    .cover-copy {
      position: absolute;
      z-index: 2;
      inset: 5.8% 7.5% 5.5%;
      display: grid;
      grid-template-rows: auto auto auto 1fr auto;
      align-content: start;
      color: var(--cover-ink);
      text-align: center;
    }

    .cover-kicker {
      font-family: var(--mono);
      font-size: clamp(8px, .72vw, 11px);
      font-weight: 600;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--pink);
    }

    .cover-title {
      margin-top: 2.2%;
      font-size: clamp(35px, 4.3vw, 60px);
      font-style: italic;
      font-weight: 600;
      letter-spacing: -.045em;
      line-height: .9;
    }

    .cover-subtitle {
      margin-top: 3%;
      font-size: clamp(10px, 1.05vw, 15px);
      font-style: italic;
      font-weight: 600;
      letter-spacing: .035em;
      color: var(--muted);
    }

    .cover-footer {
      align-self: end;
      padding-top: 3%;
      border-top: 1px solid currentColor;
      font-family: var(--mono);
      font-size: clamp(7px, .62vw, 9px);
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
      opacity: .7;
    }

    .book-card .cover-copy { --cover-ink: #E6EAF0; }

    .open-badge {
      position: absolute;
      z-index: 6;
      top: 47%;
      left: 50%;
      display: grid;
      width: 94px;
      height: 66px;
      place-items: center;
      color: var(--ink);
      background: var(--pink);
      clip-path: polygon(
        3% 22%, 10% 8%, 25% 7%, 38% 1%, 51% 6%, 66% 2%,
        77% 10%, 92% 11%, 96% 26%, 100% 39%, 95% 52%, 99% 67%,
        88% 79%, 83% 93%, 68% 94%, 55% 100%, 42% 94%, 27% 98%,
        17% 88%, 4% 84%, 5% 69%, 0 57%, 5% 43%, 1% 34%
      );
      font-size: 11px;
      font-style: italic;
      font-weight: 700;
      letter-spacing: .12em;
      opacity: 0;
      transform: translate(-50%, -50%) scale(.76) rotate(-3deg);
      transition: opacity 260ms ease, transform 420ms var(--ease), filter 260ms ease;
      pointer-events: none;
    }

    .book-card:hover .open-badge,
    .book-card[data-hovered="true"] .open-badge,
    .book-card:focus-visible .open-badge {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1) rotate(-3deg);
    }

    .book-card:focus-visible {
      outline: 0;
    }

    .book-card:focus-visible .open-badge {
      filter:
        drop-shadow(0 7px 12px rgba(2, 6, 10, .5))
        drop-shadow(0 0 8px rgba(53, 208, 186, .5));
    }

    .detail-panel {
      position: absolute;
      z-index: 12;
      top: 14.5%;
      right: 4.5%;
      width: min(47.5%, 650px);
      opacity: 0;
      transition: opacity 520ms ease 280ms;
      pointer-events: none;
    }

    .detail-title {
      margin: 0 0 24px;
      color: var(--pink);
      font-size: clamp(52px, 5.7vw, 82px);
      font-style: italic;
      font-weight: 500;
      letter-spacing: -.055em;
      line-height: .96;
      text-shadow: 0 0 30px rgba(53, 208, 186, .22);
    }

    .detail-description {
      max-width: 600px;
      margin: 0;
      color: var(--muted);
      font-size: clamp(14px, 1.28vw, 17px);
      line-height: 1.64;
    }

    .detail-scroll {
      max-height: clamp(340px, calc(100svh - 450px), 600px);
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 0 22px 76px 0;
      -webkit-mask-image: linear-gradient(
        to bottom,
        #000 0,
        #000 calc(100% - 76px),
        transparent 100%
      );
      mask-image: linear-gradient(
        to bottom,
        #000 0,
        #000 calc(100% - 76px),
        transparent 100%
      );
      scrollbar-color: rgba(53, 208, 186, .76) rgba(40, 48, 58, .5);
      scrollbar-width: thin;
    }

    .detail-scroll:focus-visible {
      border-radius: 8px;
      outline: 1px solid rgba(53, 208, 186, .6);
      outline-offset: 8px;
    }

    .detail-scroll::-webkit-scrollbar {
      width: 5px;
    }

    .detail-scroll::-webkit-scrollbar-track {
      border-radius: 999px;
      background: rgba(40, 48, 58, .5);
    }

    .detail-scroll::-webkit-scrollbar-thumb {
      border-radius: 999px;
      background: rgba(53, 208, 186, .76);
    }

    .doc-section {
      margin-top: 26px;
      padding-top: 22px;
      border-top: 1px solid rgba(53, 208, 186, .16);
    }

    .doc-label {
      margin: 0 0 16px;
      color: var(--pink);
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .doc-steps {
      display: grid;
      gap: 16px;
      margin: 0;
      padding: 0;
      list-style: none;
      counter-reset: guide-step;
    }

    .doc-steps li {
      display: grid;
      grid-template-columns: 34px 1fr;
      gap: 12px;
      counter-increment: guide-step;
    }

    .doc-steps li::before {
      content: counter(guide-step, decimal-leading-zero);
      padding-top: 2px;
      color: rgba(53, 208, 186, .7);
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: .08em;
    }

    .doc-step-copy {
      display: grid;
      gap: 4px;
    }

    .doc-step-copy strong {
      color: var(--text);
      font-size: 15px;
      font-style: italic;
      font-weight: 650;
    }

    .doc-step-copy span,
    .doc-review {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.58;
    }

    .prompt-block {
      padding: 17px 18px;
      border: 1px solid rgba(53, 208, 186, .2);
      border-radius: 12px;
      background: rgba(10, 14, 19, .7);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .03);
    }

    .prompt-block code {
      color: var(--pink-bright);
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.58;
      white-space: pre-wrap;
    }

    .doc-review {
      margin: 0;
    }

    .meta-row {
      display: grid;
      grid-template-columns: max-content 1px max-content 1fr;
      align-items: center;
      gap: clamp(16px, 2vw, 27px);
      margin-top: 22px;
      color: var(--pink);
    }

    .stars {
      display: flex;
      gap: 8px;
      font-size: 24px;
      letter-spacing: .02em;
      line-height: 1;
    }

    .stars .dim {
      color: #4a5360;
    }

    .meta-divider {
      width: 1px;
      height: 26px;
      background: rgba(53, 208, 186, .28);
    }

    .review-source,
    .year {
      color: var(--muted);
      font-size: 18px;
      font-style: italic;
      font-weight: 650;
    }

    .year {
      justify-self: end;
    }

    .detail-rule {
      height: 1px;
      margin: 10px 0 22px;
      border: 0;
      background: rgba(53, 208, 186, .24);
    }

    .bottom-dock {
      position: fixed;
      z-index: 24;
      right: 4.5%;
      bottom: 28px;
      width: min(47.5%, 650px);
    }

    .bottom-dock .meta-row {
      margin: 0 10px;
    }

    .bottom-dock .detail-rule {
      margin: 10px 8px 14px;
    }

    .action-rail {
      --action-inset: 8px;
      display: flex;
      align-items: center;
      gap: var(--action-inset);
      width: 100%;
      padding: var(--action-inset);
      border: 1px solid rgba(53, 208, 186, .14);
      border-radius: 32px;
      background: rgba(18, 22, 29, .9);
      box-shadow: 0 16px 32px rgba(2, 6, 10, .4);
      backdrop-filter: blur(12px);
    }

    .pill {
      display: inline-flex;
      flex: 1 1 0;
      align-items: center;
      justify-content: center;
      min-width: 0;
      min-height: 58px;
      padding: 0 18px;
      border-radius: 24px;
      background: rgba(53, 208, 186, .14);
      color: var(--text);
      cursor: pointer;
      font-size: 15px;
      font-style: italic;
      font-weight: 700;
      white-space: nowrap;
      transition: transform 220ms var(--ease), filter 220ms ease, background 220ms ease;
    }

    .pill:hover {

          description:
            "AETHER is a macOS-grade desktop with a security spine. No default credentials, SSH off at boot, privileged actions through fixed argument-free scripts, and zero bloatware — you add vetted tools only when you need them.",
          steps: [
            {
              title: "Boot clean",
              body: "No default passwords, SSH disabled, firewall ready. Nothing is listening that you didn't ask for."
            },
            {
              title: "Add only what you need",
              body: "Browse the Tool Store and install vetted extra tools on demand — the image stays lean."
            },
            {
              title: "Stay in the model",
              body: "Privileged actions go through pkexec on fixed scripts. Never a GUI running as root."
            },
            {
              title: "Make it yours",
              body: "A full macOS-style desktop: Control Center, Notification Center, Night Light, and global search."
            }
          ],
          prompt:
            "# ship lean, add on demand\naether-store      # vetted tools, installed only when you want them\naether-report     # compile findings into one shareable page",
          review:
            "Built for the Raspberry Pi 4 (BCM2711, ARM64). Open source under the GPL — github.com/evanchoudhury/aether-os."
        }
      };

      const body = document.body;
      const stage = document.querySelector(".stage");
      const cards = [...document.querySelectorAll(".book-card")];
      const detailPanel = document.querySelector("#detailPanel");
      const detailTitle = document.querySelector("#detailTitle");
      const detailScroll = document.querySelector("#detailScroll");
      const detailDescription = document.querySelector("#detailDescription");
      const detailSteps = document.querySelector("#detailSteps");
      const detailPrompt = document.querySelector("#detailPrompt");
      const detailReview = document.querySelector("#detailReview");
      const detailYear = document.querySelector("#detailYear");
      const closeButton = document.querySelector("#closeButton");
      const menuButton = document.querySelector("#menuButton");
      const menuLayer = document.querySelector("#menuLayer");
      const saveButton = document.querySelector("#saveButton");
      const toast = document.querySelector("#toast");
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      let selectedCard = null;
      let toastTimer = 0;
      let frame = 0;
      let pointerX = 0;
      let pointerY = 0;
      let pointerClientX = -10000;
      let pointerClientY = -10000;

      function showToast(message) {
        window.clearTimeout(toastTimer);
        toast.textContent = message;
        toast.dataset.show = "true";
        toastTimer = window.setTimeout(() => {
          toast.dataset.show = "false";
        }, 1800);
      }

      function updateParallax() {
        frame = 0;
        if (reducedMotion.matches) return;

        if (body.dataset.mode === "detail" && selectedCard) {
          const bounds = selectedCard.getBoundingClientRect();
          const bookCenterX = bounds.left + bounds.width / 2;
          const bookCenterY = bounds.top + bounds.height / 2;
          const isPointerInViewport =
            pointerClientX >= 0 &&
            pointerClientX <= window.innerWidth &&
            pointerClientY >= 0 &&
            pointerClientY <= window.innerHeight;
          const horizontalReach = pointerClientX < bookCenterX
            ? Math.max(bookCenterX, 1)
            : Math.max(window.innerWidth - bookCenterX, 1);
          const verticalReach = pointerClientY < bookCenterY
            ? Math.max(bookCenterY, 1)
            : Math.max(window.innerHeight - bookCenterY, 1);
          const viewportX = isPointerInViewport
            ? Math.max(-1, Math.min(1, (pointerClientX - bookCenterX) / horizontalReach))
            : -5 / 16;
          const viewportY = isPointerInViewport
            ? Math.max(-1, Math.min(1, (pointerClientY - bookCenterY) / verticalReach))
            : 0;
          selectedCard.style.setProperty("--detail-yaw", `${viewportX * 16}deg`);
          selectedCard.style.setProperty("--detail-pitch", `${viewportY * -10}deg`);
          selectedCard.dataset.orbiting = String(isPointerInViewport);
          return;
        }

        if (body.dataset.mode !== "gallery") return;

        document.documentElement.style.setProperty("--mx", `${pointerX * 11}px`);
        document.documentElement.style.setProperty("--my", `${pointerY * 8}px`);

        cards.forEach((card, index) => {
          const depth = index === 1 ? 1 : .58;
          card.style.setProperty("--local-x", `${pointerX * 15 * depth}px`);
          card.style.setProperty("--local-y", `${pointerY * 9 * depth}px`);
        });
      }

      function selectBook(card) {
        if (body.dataset.mode === "detail") return;
        const data = books[card.dataset.book];
        if (!data) return;

        selectedCard = card;
        selectedCard.style.setProperty("--detail-yaw", "-5deg");
        selectedCard.style.setProperty("--detail-pitch", "0deg");
        selectedCard.dataset.orbiting = "false";
        detailTitle.textContent = data.title;
        detailDescription.textContent = data.description;
        detailSteps.replaceChildren(...data.steps.map((step) => {
          const item = document.createElement("li");
          const copy = document.createElement("span");
          const title = document.createElement("strong");
          const bodyCopy = document.createElement("span");
          copy.className = "doc-step-copy";
          title.textContent = step.title;
          bodyCopy.textContent = step.body;
          copy.append(title, bodyCopy);
          item.append(copy);
          return item;
        }));
        detailPrompt.textContent = data.prompt;
        detailReview.textContent = data.review;
        detailScroll.scrollTop = 0;
        detailYear.textContent = data.year;
        cards.forEach((item) => item.classList.toggle("selected", item === card));
        cards.forEach((item) => { item.tabIndex = -1; });
        body.dataset.mode = "detail";
        detailPanel.setAttribute("aria-hidden", "false");
        detailPanel.inert = false;
        closeButton.tabIndex = 0;
        saveButton.setAttribute("aria-pressed", "false");
        window.setTimeout(() => {
          closeButton.focus({ preventScroll: true });
          if (window.innerWidth > 900) stage.scrollTop = 0;
        }, reducedMotion.matches ? 0 : 700);
      }

      function closeDetail() {
        if (body.dataset.mode !== "detail") return;
        body.dataset.mode = "gallery";
        detailPanel.setAttribute("aria-hidden", "true");
        detailPanel.inert = true;
        closeButton.tabIndex = -1;
        const lastCard = selectedCard;
        lastCard?.style.setProperty("--detail-yaw", "-5deg");
        lastCard?.style.setProperty("--detail-pitch", "0deg");
        if (lastCard) lastCard.dataset.orbiting = "false";
        window.setTimeout(() => {
          cards.forEach((card) => card.classList.remove("selected"));
          cards.forEach((card) => { card.tabIndex = 0; });
          selectedCard = null;
          lastCard?.focus({ preventScroll: true });
          if (window.innerWidth > 900) stage.scrollTop = 0;
        }, reducedMotion.matches ? 0 : 700);
      }

      function toggleMenu(force) {
        const willOpen = typeof force === "boolean"
          ? force
          : body.dataset.menu !== "open";
        body.dataset.menu = willOpen ? "open" : "closed";
        menuLayer.inert = !willOpen;
        menuButton.setAttribute("aria-expanded", String(willOpen));
        menuButton.setAttribute("aria-label", willOpen ? "Close menu" : "Open menu");
      }

      cards.forEach((card) => {
        card.addEventListener("click", () => selectBook(card));
        card.addEventListener("pointerenter", () => card.dataset.hovered = "true");
        card.addEventListener("pointerleave", () => card.dataset.hovered = "false");
      });

      window.addEventListener("pointermove", (event) => {
        pointerX = event.clientX / window.innerWidth - .5;
        pointerY = event.clientY / window.innerHeight - .5;
        pointerClientX = event.clientX;
        pointerClientY = event.clientY;
        if (!frame) frame = window.requestAnimationFrame(updateParallax);
      }, { passive: true });

      window.addEventListener("pointerleave", () => {
        pointerX = 0;
        pointerY = 0;
        pointerClientX = -10000;
        pointerClientY = -10000;
        if (!frame) frame = window.requestAnimationFrame(updateParallax);
      });

      closeButton.addEventListener("click", closeDetail);
      menuButton.addEventListener("click", () => toggleMenu());

      saveButton.addEventListener("click", () => {
        const saved = saveButton.getAttribute("aria-pressed") !== "true";
        saveButton.setAttribute("aria-pressed", String(saved));
        showToast(saved ? "Starred. Now go star the repo too." : "Unstarred.");
      });

      document.addEventListener("click", (event) => {
        const toastTarget = event.target.closest("[data-toast]");
        if (toastTarget) {
          event.preventDefault();
          showToast(toastTarget.dataset.toast);
        }

        if (event.target.closest("[data-menu-close]")) {
          toggleMenu(false);
        }
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          if (body.dataset.menu === "open") {
            toggleMenu(false);
          } else {
            closeDetail();
          }
        }
      });
    })();
  </script>
</body>
</html>
