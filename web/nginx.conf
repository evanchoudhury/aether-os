server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/html text/css application/javascript image/svg+xml application/json;

    # Fingerprinted build assets never change — cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Serve real files (incl. /landing-pages/kibori.html) first, else the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
